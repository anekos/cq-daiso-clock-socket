[project]
name = "daiso-clock-socket"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anekos", email = "anekos@snca.net" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
app = "daiso_clock_socket:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daiso_clock_socket"]

[dependency-groups]
dev = [
    "cadquery>=2.8.0",
    "click>=8.4.2",
    "click-cadquery>=0.2.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

# casadi 3.8.0 ships a casadi.pyi with duplicate parameter names, which breaks mypy.
# Fix planned for 3.8.1: https://github.com/casadi/casadi/issues/4390
[[tool.mypy.overrides]]
module = "casadi.*"
follow_imports = "skip"
follow_imports_for_stubs = true
